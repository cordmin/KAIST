<script id="source-data" type="application/json">[{"name": "이민규", "file": "이민규 인터뷰.docx", "paragraphs": ["과학으로 시작한 길, 이제 사회를 향해", "초등학생 때 과학대회에 참가하며 키운 흥미는 과학고등학교로의 진학과 카이스트 대학원 연구로 이어졌다. 학부생 실험 지도와 본인의 연구를 함께하며 석사 과정을 마무리하고 있는 이민규 연구원. 익숙한 연구실을 떠나 회사에서 새로운 경험을 쌓고 싶다는 그에게, 과학을 좋아했던 시간과 앞으로의 선택에 관해 물었다.", "Q1) 과학에 관심을 갖게 된 계기는 무엇인가요?", "초등학생 때부터 과학을 좋아했습니다. 과학대회에 참가하고 입상하면서 흥미가 더 커졌습니다. 좋아하는 분야에 직접 도전하고 성과를 얻는 경험이 과학을 계속 공부하는 계기가 되었습니다. 이후 진주에 있는 경남과학고등학교에 진학했고, 당시 대체로 2학년을 마치며 조기 졸업 또는 조기 진학을 하던 시기였는데 저도 그 과정을 거쳐 지금 카이스트 화학과에 들어오게 되었습니다.", "Q2) 과학고 진학을 위해 선행학습을 많이 했나요?", "선행학습은 중학교 2학년 때 시작했습니다. 주변에는 탐구 과목을 여러 번 반복해서 공부한 친구들도 있었지만, 저는 그 정도로 준비하지는 않았습니다. 제 경험으로는 선행학습의 양을 늘리기보다는 중학교에서 배우는 내용을 충실히 익히고 학교 성적을 관리하는 일이 오히려 과학고등학교 진학에는 더 효과가 있다고 생각해요. 다른 친구의 준비 속도에 맞추려 하기보다, 자신이 배우는 내용을 제대로 이해하고 있는지 살펴보는 것이 중요한 것 같아요.", "Q3) 연구실에서는 지도교수님과 어떻게 소통하나요?", "급한 일이 아니라면 주로 이메일로 소통합니다. 교수님을 직접 뵈어야 할 때도 바로 연구실을 찾아가기보다 먼저 내선전화로 연락드려 약속을 잡습니다. 휴대전화로 연락드리는 것은 사적인 영역과 연결되기 때문에 매우 긴박한 상황이 아니면 피하는 편입니다. 업무 내용과 진행 과정은 이메일로 남기는 것을 중요하게 생각합니다. 서로의 시간을 존중하면서 어떤 이야기가 오갔는지도 기록할 수 있는 방식입니다.", "Q4) 현재 연구실에서는 어떤 일을 하고 있나요?", "제 연구를 진행하면서 학부생들의 실험을 돕는 조교 역할을 맡고 있습니다. 대학원생으로서 공부하고 연구하는 일과 함께, 학부생들이 실험을 수행할 수 있도록 지원하는 일도 연구실 생활의 한 부분입니다. 지금은 이러한 역할을 이어가며 졸업과 이후 진로를 준비하고 있습니다.", "Q5) 앞으로는 어떤 길을 생각하고 있나요?", "석사학위를 마친 뒤 회사에 취직해 사회생활을 하고 싶은 마음이 있습니다. 대학원에서 연구를 더 이어가기보다는 새로운 환경에서 일하는 경험을 쌓고 싶습니다. 박기영 지도 교수님께서는 제 생각을 존중해 주셨고, 취업 준비에 도움이 되도록 내년 1학기까지 연구실에 조금 더 머물며 제 커리어에 도움이 될 논문 작성하는 것을 권해주셨고 저도 역시 같은 생각을 갖고 마지막까지 최선을 다하고 있습니다.", "Q6) 군 복무 경험은 진로를 준비하는 데 어떤 영향을 주었나요?", "저는 부산 해운대에 소재하는 공군기지에서 군 복무를 했습니다. 이미 군대를 다녀왔기 때문에 병역과 연계해 일정 기간 연구를 계속해야 하는 부담이 없다는 점이 지금 생각하면 장점일 수도 있겠다 생각합니다. 연구를 더 할지, 회사에 취직할지 고민할 때 제 마음과 상황에 따라 선택할 수 있다는 점에서 의미가 있습니다.", "Q7) 취업 후에는 어떤 곳에서 생활하고 싶나요?", "어느 지역에서 일하게 될지는 아직 정하지 않았습니다. 다만 그동안 비교적 한적한 곳에서 생활해 왔기 때문에 대전의 생활환경도 잘 맞는 편입니다. 대전에도 취업할 수 있는 곳이 있는 만큼, 이곳에서 직장을 구하고 계속 생활하게 되더라도 만족할 수 있을 것 같습니다."]}, {"name": "안영균", "file": "안영균 인터뷰.docx", "paragraphs": ["좋아하는 마음이 나의 길이 되기까지", "어려서부터 게임을 좋아하던 학생은 자연스레 프로그래밍에 관심이 갔고,", "수학 문제를 더 간단하게 풀고 싶었던 학생은 어려서 부터 자신만의 연구 노트를 만들었다.", "화학과 게임 개발 사이에서 고민하던 시간을 지나", "지금은 양자 컴퓨터를 연구하는 안영균 연구원.", "궁금한 것을 이해하고 좋아하는 것을 더 깊이 알아가려는 마음이 그를 이곳으로 이끌었다.", "Q1) 어릴 때부터 연구자가 되고 싶었나요?", "처음에는 프로그래머나 수학자가 되고 싶었습니다. 컴퓨터 게임을 좋아하던 저에게 부모님이 컴퓨터를 배울 기회를 주셨고, 선생님의 권유로 프로그래밍을 접했습니다. 이후 프로그래밍에 필요한 수학에도 관심이 생겼습니다. 연구자의 길로 이어지는 중요한 계기는 중학생 때 만난 선생님이었습니다. 반복되는 수학 문제를 더 간단하게 풀고 싶다고 말씀드렸더니, 직접 공식을 만들어 보라고 격려해 주셨습니다. 그렇게 만든 풀이와 질문을 연구 노트에 모으면서, 공부가 궁금한 것을 해결하기 위한 도구가 될 수 있다는 사실을 배웠습니다.", "Q2) 시간 가는 줄 모르고 빠져들었던 주제가 있었나요?", "중학교 때 피보나치 수열에 깊이 빠졌습니다. 간단한 규칙에서 출발하는 수열인데, 자연수로 이루어진 수열의 일반항에 무리수가 등장한다는 점이 신기했습니다. 약 1년에서 1년 반 동안 관련 성질을 탐구하고 정리했고, 연구 노트의 절반이 피보나치 수 이야기로 채워졌습니다. 관련 책을 읽다가 수식 오류를 발견해 출판사에 정리해서 보낸 일도 있습니다. 스스로 재미를 느낀 주제를 오래 붙잡아 보는 경험이 탐구의 즐거움을 알려 주었습니다.", "Q3) 수학과 프로그래밍을 좋아했는데, 화학은 어떻게 선택했나요?", "중학생 때 오비탈을 배우면서 의문이 생겼습니다. 전자를 입자라고 하면서 왜 구름처럼 표현하고 확률로 설명하는지 이해되지 않았습니다. 당시에는 충분히 이해하기 어렵다는 말을 듣고 오히려 언젠가는 꼭 알아내고 싶어졌습니다. 고등학교에서는 화학과 정보 올림피아드 일정이 겹쳐 둘 중 하나를 골라야 했는데, 둘 다 좋아해서 결국 동전 던지기로 화학을 선택했습니다. 지금은 화학과 컴퓨터 활용 능력이 함께 필요한 연구를 하고 있으니, 서로 다른 관심사가 한곳에서 만난 셈입니다.", "Q4) 연구를 떠나 다른 길을 고민한 적도 있나요?", "대학에서 화학을 공부하며, 복잡한 문제를 정확하게 풀기 어려워 근사 방법을 사용한다는 사실에 실망한 적이 있습니다. 명확한 진리를 찾고 싶었던 제 기대와 달랐기 때문입니다. 마침 퍼즐 동아리에서 만든 온라인 게임이 좋은 반응을 얻었고, 휴학 후 약 6개월 동안 게임 회사에서 일했습니다. 하지만 게임 개발 역시 제가 상상했던 모습과는 달랐습니다. 그 경험을 통해 어떤 분야든 충분히 경험하기 전에 나와 맞는지 단정하기 어렵다는 것을 느꼈습니다. 연구도 진지하게 해 본 뒤 판단하자는 마음으로 돌아왔습니다.", "Q5) 연구를 계속하게 만든 말이 있나요?", "지도교수님께서 연구자에게 중요한 것은 좌절을 견디는 힘이라고 말씀해 주셨습니다. 좋은 아이디어라고 생각했는데 실제로는 성립하지 않거나, 이미 다른 사람이 연구한 경우가 많습니다. 기대대로 풀리지 않는 시간이 연구의 상당 부분을 차지한다는 뜻이었습니다. 그 말을 듣고 어려움이 생길 때마다 제 선택이 틀렸다고 생각하기보다, 연구 과정에서 마주치는 좌절을 어떻게 견딜지 생각하게 되었습니다. 지금도 쉽지는 않지만, 제가 무엇 때문에 힘든지 이해하게 해 준 말입니다.", "Q6) 현재 어떤 연구를 하고 있으며, 연구를 통해 생각이 어떻게 달라졌나요?", "현재는 양자컴퓨터와 관련된 이론 연구를 하고 있습니다. 처음에는 과학이 명확한 정답을 찾는 일이라고 생각했지만, 실제 연구에서는 계산 시간과 자원의 한계 속에서 무엇을 반영하고 무엇을 단순화할지 판단해야 합니다. 예전에는 이런 타협을 받아들이기 어려웠지만, 지금은 중요한 것을 지키면서 현실적인 해법을 찾는 과정도 연구의 본질이라고 생각합니다. 공부할 때도 지식의 가지를 끝없이 따라가기보다, 처음에 무엇을 이해하려고 시작했는지 돌아보려 합니다.", "Q7) 연구와 함께 교육에도 관심이 큰 이유는 무엇인가요?", "제가 만난 좋은 선생님들은 자신이 가르치는 내용을 진심으로 즐기는 분들이었습니다. 그 모습을 보면서 저도 관심을 갖고 더 배우고 싶어졌습니다. 저 역시 제가 경험한 배움의 즐거움을 다른 사람에게 전하고 싶습니다. 퍼즐을 좋아하는 이유도 비슷합니다. 배운 개념으로 새로운 문제를 풀고 스스로 원리를 깨닫는 순간에는 특별한 즐거움이 있습니다. 좋은 퍼즐과 좋은 수업은 상대방의 눈높이를 이해하고, 스스로 발견에 도달하도록 안내한다는 점에서 닮아 있습니다.", "Q8) 진로를 고민하는 학생들에게 전하고 싶은 말은 무엇인가요?", "좋아하는 것을 너무 일찍 내려놓지 않았으면 합니다. 저 역시 원하는 학교에 떨어지고 조기 졸업에 실패하며 크게 흔들렸습니다. 하지만 한 번의 결과가 이후의 모든 길을 결정하지는 않았습니다. 자신이 무엇을 좋아하고 어떤 가치를 중요하게 여기는지 알아가는 일이 필요합니다. 처음부터 뛰어난 성과를 내지 못하더라도, 좋아하는 것을 가꾸고 더 깊이 알아가려고 노력하는 마음 자체가 귀한 재능이라고 생각합니다. 과거의 저에게도 잘될 테니 너무 걱정하지 말라고 말해 주고 싶습니다."]}, {"name": "김소연, 김소원", "file": "김소연, 김소원 인터뷰.docx", "paragraphs": ["빛을 받은 분자 안에서는 어떤 일이 일어날까.", "눈에 보이지 않는 짧은 순간을 이해하기 위해 두 연구자는 컴퓨터로 분자의 움직임을 계산한다. 분자와 전자의 상호작용 연구들을 연결하며 새로운 가능성을 찾는 김소연 연구원과,", "작은 단백질 속 상호작용을 끈기 있게 추적하는 김소원 연구원.", "각자의 연구 방식도 성향도 다르지만, 두 사람을 같은 연구실로 이끈 출발점은", "어려서부터 화학을 좋아하는 마음으로 부터 시작되었다.", "Q1) 현재 어떤 주제를 연구하고 있나요?", "김소연　분자가 빛을 받은 뒤 어떻게 움직이고 반응하는지 연구합니다. 특히 전자의 스핀과 양자역학적 위상 효과가 분자의 움직임에 어떤 영향을 주는지 관심이 있습니다. 작은 분자라도 정밀하게 계산하려면 많은 시간이 필요하기 때문에, 계산 결과에 대한 정확도 뿐만 아니라 연구에 사용할 수 있는 계산 자원을 함께 고려해야 합니다.", "김소원　빛을 받은 분자의 움직임을 더 효율적으로 계산하는 방법에 관심이 있습니다. 필요한 계산 결과를 미리 모아 두고, 그 사이의 값을 추정해 계산 부담을 줄이는 방식입니다. 여기서 중요한 질문은 어떤 데이터를 얼마나 모아야 믿을 수 있는 결과를 얻을 수 있느냐는 것입니다. 현재는 이 방법을 활용해 빛에 반응하는 단백질의 움직임을 연구하고 있습니다.", "Q2) 작은 단백질의 움직임 연구에 대해 좀 더 자세히 설명해주세요.", "김소원　박테리아가 빛을 감지하는 데 관여하는 광활성 황색 단백질을 연구합니다. 그 안에서 빛을 직접 흡수하는 작은 분자가 주변 환경과 어떤 영향을 주고받는지 살펴보고 있습니다. 저희 계산에서는 주변의 전하뿐 아니라 수소 결합이 분자의 변화에 맞춰 달라지는 과정이 중요하게 나타났습니다. 선배에게서 이어받은 연구를 진행하면서 계산 코드를 점검하고 자료를 정리했으며, 현재는 결과를 논문으로 정리하고 검증하는 단계입니다.", "Q3) 석박사 통합과정 연구 주제를 정하게 된 과정이 궁금해요.", "김소연　CPRL에 처음에 들어왔을 때 교수님의 배려와 제안으로 여러 내용을 공부하며 무엇이 재미있는지 탐색할 시간이 있었습니다. 이후 제가 관심을 느낀 주제를 말씀드렸고, 교수님께서 도전해 보도록 해 주셨습니다. 새로운 분야였기 때문에 스스로 충분히 이해하고 연구 방향을 설명해야 한다는 책임도 컸습니다. 기존 논문들을 읽으며 아직 밝혀지지 않은 부분과 제가 할 수 있는 일을 찾는 데 상당한 시간이 걸렸습니다.", "김소원　저는 처음 약 1년 반 동안 양자 컴퓨터와 관련된 연구를 했습니다. 하지만 제가 더 보고 싶었던 것은 화학 현상 자체였고, 당시의 연구 방향과 제 관심 사이에 차이가 있었습니다. 그래서 양자 컴퓨터가 아닌 일반 고성능 컴퓨터를 활용하는 분자 시뮬레이션으로 방향을 바꾸었습니다. 처음 세운 계획을 그대로 따르기보다, 공부하면서 제가 정말 궁금해 하는 것이 무엇인지 찾아간 셈입니다.", "Q4) 계산 결과가 예상대로 나오면 정말 기쁠텐데, 혹시 그 순간 의심을 해보기도 하나요?", "김소연　기쁘지만, 그 결과가 맞는지 의심하는 과정이 필요합니다. 의미 있는 결과값이라고 생각해  6개월동안 교수님께 제 시뮬레이션 결과에 대해 설명했던 내용이 알고보니 코드 오류에서 비롯된 것으로 드러난 경험도 있었습니다. 작은 부호 하나가 계산 결과를 크게 바꿀 수 있었던 상황이었는데, 결과가 보기 좋다는 이유 만으로 섣불리 믿지 않고, 계산 과정과 해석을 확인해야 한다는 것을 배웠습니다.", "김소원　저도 좋은 결과를 얻으면 당연히 기쁜 마음으로 교수님을 찾아갑니다. 하지만 다시 살펴보다 이상한 점을 발견해 설명을 수정하는 일이 있었습니다. 더군다나 선배에게서 이어받은 코드의 오류를 몇 년만에 찾아 수정한 경험도 있습니다. 결과를 얻는 것만큼, 그 결과를 믿을 근거를 확인하는 일도 중요합니다.", "Q5) 지도교수님과는 어떤 관계로 연구하나요?", "김소연　이영민 교수님께서는 저희가 하고 있는 연구에 관해서는 동등한 연구자의 위치로서 제 주장을 합당한 근거를 들어 교수님을 설득해보라고 말씀해 주십니다. 논문 심사자가 물을 법한 질문을 미리 받는 느낌입니다. 힘들 때도 있지만, 제 연구를 다른 사람에게 설명하고 방어하는 훈련이 됩니다. 처음에는 당연히 교수님이 어려웠지만, 지금은 일상에서 편하게 이야기를 나누기도 하고, 시간이 지나면서 같은 문제를 함께 풀어가는 공동체라는 생각이 커졌습니다.", "김소원　교수님의 질문을 받으면 제가 무엇을 알고 무엇을 모르는지 드러납니다. 다른 논문과 비교했는지, 계산을 바꾼 이유가 무엇인지 설명하려면 다시 공부해야 합니다. 결과를 가져가는 것으로 끝나는 것이 아니라, 그 과정까지 이해해야 한다는 것을 배웁니다.", "Q6) AI은 연구에 어떻게 활용되고 있나요?", "김소원　수식을 이해하는 실마리를 얻거나, 코드를 분석하거나, 논문 영어 문장을 다듬는 데 활용합니다. 하지만 인공지능이 제시한 내용을 그대로 정답으로 받아들이지는 않으려 합니다. 코드가 왜 그렇게 작성됐는지, 무엇을 수정했는지 제가 설명하고 검증할 수 있어야 합니다. 실제로 오류를 찾는 데 도움을 받았지만, 수정한 내용의 의미를 다시 확인하는 과정도 필요했습니다.", "김소연　정보가 많이 정리되어 있다는 것과 제가 그것을 이해했다는 것은 다릅니다. 인공지능을 사용하면서 그 차이를 더 고민하게 됐습니다. 연구자가 방향을 판단하지 못하면 그럴듯한 자료만 쌓일 수도 있습니다. 무엇을 질문하고 어떤 답을 받아들일지 결정하는 능력을 기르는 것이 중요하다고 생각합니다.", "Q7) 연구가 잘 풀리지 않을 때 오는 스트레스를 어떻게 해결하시는 편인가요?", "김소원　처음에는 결과가 잘못되면 제 능력 전체를 의심하며 크게 좌절했습니다. 지금도 힘든 경우들이 늘 있지만, 잠시 실망한 뒤 다시 돌아오는 힘이 예전보다 더 생긴 것 같습니다. 마치 내성이 생긴 것 처럼요. 심리 상담을 통해 제 상태를 돌아본 경험도 도움이 됐습니다. 연구가 어렵다는 것과 제가 부족한 사람이라는 것을 같은 뜻으로 받아들이지 않으려 합니다.", "김소연　기대했던 효과가 나오지 않았더라도, 왜 그런지 제대로 분석하면 다른 사람에게 의미 있는 지식이 될 수 있습니다. 원하는 결과가 나오지 않았던 연구라고 하더라도 그 과정에서 알게 된 방법과 결론이 다음 연구에 도움이 됩니다. 따라서 원하는 결과를 얻지 못했다는 이유 만으로 그 과정의 가치를 모두 지울 필요는 없다고 생각합니다.", "Q8) 기초 과학 연구 결과가 우리의 삶에 어떤 영향을 줄 수 있나요?", "김소원　기초 과학은 당장의 활용처가 분명하지 않아도 자연의 원리를 이해하는 일에는 가치가 있다고 생각합니다. 저는 화학을 공부하는 것이 재미있어서 여기까지 왔습니다. 작은 단백질이 어떻게 움직이는지 알아내는 일도 우리가 자연을 이해하는 범위를 넓혀 줍니다. 새로운 기계를 만드는 성과와 함께, 이런 발견의 의미도 인정받았으면 합니다.", "김소연　저는 서로 다른 분야가 연결되는 가능성에도 관심이 있습니다. 도시의 구조에 따라 교통 흐름이 달라지는 문제와, 분자가 놓인 에너지 환경에 따라 움직임이 달라지는 문제에서 비슷한 접근을 떠올린 적이 있습니다. 분야가 다르더라도 사용하는 수학이나 문제 해결 방식에서 배울 점이 있을 수 있습니다. 다양한 사람과 대화하는 일이 연구의 새로운 출발점이 되기도 합니다.", "Q9) 진로를 고민하는 학생들에게 이공계 길을 먼저 걸었던 선배님으로서 해주고 싶은 말!", "김소연　원하던 학교에 가지 못했다고 해서 좋아하던 과학까지 포기할 필요는 없습니다. 저도 과학고 진학에 실패했고, 처음부터 바라던 길로 곧장 온 것은 아닙니다. 다른 사람의 평가 하나로 자신의 가능성을 결정하지 않았으면 합니다. 여러 경험을 하며 자신이 어떤 일을 할 때 즐거운지 알아가는 시간도 중요합니다.", "김소원　저는 고등학교 2학년 때 화학 선생님의 수업을 계기로 본격적으로 공부하기 시작했습니다. 처음부터 공부를 잘했거나 진로가 확실했던 것은 아닙니다. 시험이나 대학 진학만을 위한 공부보다, 알고 싶어서 하는 공부의 즐거움을 경험했으면 합니다. 관심 있는 것을 찾는 시점이 친구들과 다르더라도, 그것 만으로 늦었다고 생각하지 않았으면 좋겠습니다."]}]</script>

function makeDocx(paragraphs){
 const xml=s=>s.replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f]/g,'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c]));
 const body=paragraphs.map((p,i)=>{const question=/^Q\d+\)/.test(p);return '<w:p><w:pPr>'+(i===0?'<w:pStyle w:val="Title"/>':question?'<w:pStyle w:val="Heading1"/>':'')+'</w:pPr><w:r><w:t xml:space="preserve">'+xml(p).replace(/\r?\n/g,'</w:t><w:br/><w:t xml:space="preserve">')+'</w:t></w:r></w:p>'}).join('');
 const files={
 '[Content_Types].xml':'<?xml version="1.0" encoding="UTF-8"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/></Types>',
 '_rels/.rels':'<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>',
 'word/document.xml':'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>'+body+'<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1134" w:right="1134" w:bottom="1134" w:left="1134"/></w:sectPr></w:body></w:document>',
 'word/_rels/document.xml.rels':'<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>',
 'word/styles.xml':'<?xml version="1.0" encoding="UTF-8"?><w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="Malgun Gothic" w:hAnsi="Malgun Gothic" w:eastAsia="맑은 고딕"/><w:color w:val="111827"/><w:sz w:val="22"/></w:rPr></w:rPrDefault><w:pPrDefault><w:pPr><w:spacing w:after="180" w:line="360" w:lineRule="auto"/></w:pPr></w:pPrDefault></w:docDefaults><w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/></w:style><w:style w:type="paragraph" w:styleId="Title"><w:name w:val="Title"/><w:basedOn w:val="Normal"/><w:pPr><w:spacing w:after="320"/><w:keepNext/></w:pPr><w:rPr><w:b/><w:color w:val="000000"/><w:sz w:val="38"/></w:rPr></w:style><w:style w:type="paragraph" w:styleId="Heading1"><w:name w:val="heading 1"/><w:basedOn w:val="Normal"/><w:pPr><w:spacing w:before="280" w:after="140"/><w:keepNext/></w:pPr><w:rPr><w:b/><w:sz w:val="25"/></w:rPr></w:style></w:styles>'};
 const encoder=new TextEncoder(),parts=[],central=[];let offset=0;
 function crc32(bytes){let c=0xffffffff;for(const b of bytes){c^=b;for(let k=0;k<8;k++)c=(c>>>1)^((c&1)?0xedb88320:0)}return (c^0xffffffff)>>>0}
 function header(length){const bytes=new Uint8Array(length);return {bytes,view:new DataView(bytes.buffer)}}
 for(const [path,content] of Object.entries(files)){
  const name=encoder.encode(path),data=encoder.encode(content),crc=crc32(data),local=header(30);local.view.setUint32(0,0x04034b50,true);local.view.setUint16(4,20,true);local.view.setUint16(12,33,true);local.view.setUint32(14,crc,true);local.view.setUint32(18,data.length,true);local.view.setUint32(22,data.length,true);local.view.setUint16(26,name.length,true);parts.push(local.bytes,name,data);
  const dir=header(46);dir.view.setUint32(0,0x02014b50,true);dir.view.setUint16(4,20,true);dir.view.setUint16(6,20,true);dir.view.setUint16(14,33,true);dir.view.setUint32(16,crc,true);dir.view.setUint32(20,data.length,true);dir.view.setUint32(24,data.length,true);dir.view.setUint16(28,name.length,true);dir.view.setUint32(42,offset,true);central.push(dir.bytes,name);offset+=30+name.length+data.length;
 }
 const centralSize=central.reduce((n,p)=>n+p.length,0),end=header(22),count=Object.keys(files).length;end.view.setUint32(0,0x06054b50,true);end.view.setUint16(8,count,true);end.view.setUint16(10,count,true);end.view.setUint32(12,centralSize,true);end.view.setUint32(16,offset,true);
 return new Blob([...parts,...central,end.bytes],{type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
}
$('download').onclick=()=>{try{const url=URL.createObjectURL(makeDocx(values())),a=document.createElement('a');a.href=url;a.download=documents[current].name+' 인터뷰_수정본.docx';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}catch(e){announce('문서를 만들지 못했습니다. 다시 시도해 주세요.');console.error('DOCX 생성 실패',e)}};
$('logout').onclick=()=>{if(dirty&&!save())return;$('workspace').classList.add('hidden');$('access').classList.remove('hidden');$('person').value=String(current);$('editor').replaceChildren();$('password').focus();window.scrollTo(0,0)};
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'&&!$('workspace').classList.contains('hidden')){e.preventDefault();if(save())announce('수정 내용을 저장했습니다.')}});window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
</script>
