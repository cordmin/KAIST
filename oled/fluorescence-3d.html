<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>형광빛의 원리 | KAIST 가상실험실</title>
  <style>
    :root { color-scheme: dark; font-family: Pretendard, "Noto Sans KR", system-ui, sans-serif; --ink: #f4f1ea; --dim: #9d988d; --line: rgba(244, 241, 234, .12); --gold: #e2bd72; --uv: #b085ff; --heat: #ff6a4d; --glow: #5aa9ff; --light: #a78bfa; }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { margin: 0; height: 100%; background: #05060a; color: var(--ink); }
    button { font: inherit; color: inherit; cursor: pointer; }
    .app { height: 100vh; min-height: 540px; display: grid; grid-template-columns: minmax(0, 1fr) 340px; }

    /* 3D 무대 */
    .stage { position: relative; min-width: 0; overflow: hidden; }
    #scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
    .title { position: absolute; left: 28px; top: 22px; pointer-events: none; }
    .title small { color: var(--gold); font-size: .78rem; font-weight: 800; letter-spacing: .04em; }
    .title h1 { margin: .25rem 0 0; font-size: clamp(1.3rem, 2vw, 1.8rem); font-weight: 900; letter-spacing: -.04em; }

    /* 진행 단계: 빛 쬐기 → 흡수 → 열 → 형광 */
    .steps { position: absolute; left: 50%; top: 30px; transform: translateX(-50%); display: flex; align-items: center; margin: 0; padding: 0; list-style: none; pointer-events: none; color: rgba(244, 241, 234, .34); font-size: .9rem; font-weight: 800; white-space: nowrap; }
    .steps li { display: flex; align-items: center; gap: .5rem; transition: color .3s; }
    .steps li + li::before { content: ""; width: 30px; height: 1px; margin: 0 .7rem; background: currentColor; opacity: .5; }
    .steps i { width: 9px; height: 9px; border-radius: 50%; background: currentColor; transition: box-shadow .3s; }
    .steps li.done { color: rgba(244, 241, 234, .72); }
    .steps li.now { color: var(--c); }
    .steps li.now i { box-shadow: 0 0 0 4px color-mix(in srgb, var(--c) 30%, transparent), 0 0 14px var(--c); }
    .steps li.miss { color: #ff8f7a; }

    /* 아래 조작 막대 */
    .dock { position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%); display: flex; align-items: center; gap: 22px; padding: 12px 14px 12px 24px; border: 1px solid var(--line); border-radius: 999px; background: rgba(12, 13, 18, .8); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); box-shadow: 0 20px 50px rgba(0, 0, 0, .5); }
    .pick { display: grid; gap: 9px; }
    .pick-label { color: var(--dim); font-size: .78rem; font-weight: 700; white-space: nowrap; }
    .pick-label b { color: var(--ink); }
    .chips { display: flex; gap: 9px; }
    .chip { width: 24px; height: 24px; padding: 0; border: 0; border-radius: 50%; background: var(--c); box-shadow: inset 0 0 0 2px rgba(0, 0, 0, .3); transition: transform .15s, box-shadow .15s; }
    .chip.uv { background: repeating-linear-gradient(135deg, #c9b2ff 0 3px, #6d4bd8 3px 6px); }
    .chip:hover:not(:disabled) { transform: scale(1.18); }
    .chip[aria-checked="true"] { box-shadow: 0 0 0 2px #0c0d12, 0 0 0 4px var(--ink), 0 0 16px var(--c); }
    .chip:disabled { cursor: default; opacity: .4; }
    .fire { position: relative; flex: none; width: 76px; height: 76px; border: 0; border-radius: 50%; color: #0b0b10; font-size: .95rem; font-weight: 900; background: radial-gradient(circle at 50% 32%, color-mix(in srgb, var(--light) 55%, #fff), color-mix(in srgb, var(--light) 80%, #000)); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .3), 0 0 28px color-mix(in srgb, var(--light) 55%, transparent); transition: transform .15s; }
    .fire:hover:not(:disabled) { transform: scale(1.06); }
    .fire:active:not(:disabled) { transform: scale(.95); }
    .fire:disabled { cursor: default; }
    .fire::after { content: ""; position: absolute; inset: -7px; border-radius: 50%; background: conic-gradient(var(--ink) calc(var(--p, 0) * 1turn), transparent 0); -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2px)); mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2px)); }
    .fire.ready::before { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--light); animation: ping 1.8s ease-out infinite; }
    @keyframes ping { from { transform: scale(1); opacity: .8; } to { transform: scale(1.45); opacity: 0; } }
    .side { display: grid; gap: 9px; justify-items: start; }
    .seg { display: flex; padding: 3px; border-radius: 999px; background: rgba(255, 255, 255, .07); }
    .seg button { padding: .42rem .8rem; border: 0; border-radius: 999px; background: none; color: var(--dim); font-size: .8rem; font-weight: 800; white-space: nowrap; }
    .seg button[aria-pressed="true"] { background: var(--ink); color: #0b0b10; }
    .pause { display: inline-flex; align-items: center; gap: .45rem; padding: .3rem .2rem; border: 0; background: none; color: var(--dim); font-size: .8rem; font-weight: 800; white-space: nowrap; }
    .pause:disabled { opacity: .35; cursor: default; }
    .pause:hover:not(:disabled) { color: var(--ink); }
    .pause svg { width: 12px; height: 12px; fill: currentColor; }

    /* 오른쪽: 전자의 에너지 계단 */
    .panel { display: flex; flex-direction: column; gap: 16px; min-height: 0; padding: 74px 26px 26px; border-left: 1px solid var(--line); background: linear-gradient(180deg, #0b0c11, #06070b); }
    .panel h2 { margin: 0; font-size: 1.05rem; font-weight: 900; letter-spacing: -.02em; }
    .note { min-height: 2.9em; margin: .45rem 0 0; color: var(--dim); font-size: .86rem; line-height: 1.5; word-break: keep-all; transition: color .3s; }
    #ladder { display: block; width: 100%; flex: 1 1 auto; min-height: 220px; }
    .grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 3px; }
    .grid i { aspect-ratio: 1; border-radius: 2px; background: rgba(244, 241, 234, .08); transition: background .25s, box-shadow .25s; }
    .grid i.red { background: var(--heat); box-shadow: 0 0 6px rgba(255, 106, 77, .55); }
    .grid i.blue { background: var(--glow); box-shadow: 0 0 6px rgba(90, 169, 255, .55); }
    .totals { display: flex; justify-content: space-between; margin-top: 12px; }
    .totals small { display: block; color: var(--dim); font-size: .78rem; font-weight: 700; }
    .totals strong { font-size: 2rem; font-weight: 900; font-variant-numeric: tabular-nums; letter-spacing: -.03em; }
    .totals .r strong { color: #ff9c89; }
    .totals .b { text-align: right; }
    .totals .b strong { color: #8cc4ff; }
    /* 왼쪽 아래 모형 읽는 법 */
    .key { position: absolute; left: 24px; bottom: 22px; display: grid; gap: 10px; padding: 14px 18px 14px 14px; border: 1px solid var(--line); border-radius: 16px; background: rgba(12, 13, 18, .72); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); pointer-events: none; }
    .key div { display: flex; align-items: center; gap: 12px; font-size: .8rem; color: var(--dim); white-space: nowrap; }
    .key b { display: block; color: var(--ink); font-size: .86rem; }
    .key .ball { flex: none; width: 26px; height: 26px; display: grid; place-items: center; }
    .key .ball::before { content: ""; width: 18px; height: 18px; border-radius: 50%; background: radial-gradient(circle at 34% 30%, #c9ced6 0, #6b717b 38%, #2c3037 100%); box-shadow: 0 2px 6px rgba(0, 0, 0, .6); }
    /* 화면 속 구름처럼 흩어진 작은 점들 (가운데를 비우면 원자 모형처럼 보여서 채움) */
    .key .cloud { flex: none; width: 26px; height: 26px; border-radius: 50%; background: radial-gradient(circle at 22% 30%, rgba(196,206,226,.95) 0 1.3px, transparent 1.9px), radial-gradient(circle at 48% 18%, rgba(196,206,226,.95) 0 1.3px, transparent 1.9px), radial-gradient(circle at 74% 32%, rgba(196,206,226,.95) 0 1.3px, transparent 1.9px), radial-gradient(circle at 36% 52%, rgba(196,206,226,.95) 0 1.3px, transparent 1.9px), radial-gradient(circle at 62% 48%, rgba(196,206,226,.95) 0 1.3px, transparent 1.9px), radial-gradient(circle at 84% 60%, rgba(196,206,226,.95) 0 1.3px, transparent 1.9px), radial-gradient(circle at 18% 68%, rgba(196,206,226,.95) 0 1.3px, transparent 1.9px), radial-gradient(circle at 46% 78%, rgba(196,206,226,.95) 0 1.3px, transparent 1.9px), radial-gradient(circle at 70% 82%, rgba(196,206,226,.95) 0 1.3px, transparent 1.9px), radial-gradient(circle at 54% 34%, rgba(196,206,226,.95) 0 1.3px, transparent 1.9px), radial-gradient(circle at 30% 40%, rgba(196,206,226,.95) 0 1.3px, transparent 1.9px), radial-gradient(circle at 78% 46%, rgba(196,206,226,.95) 0 1.3px, transparent 1.9px), radial-gradient(circle, rgba(143, 155, 179, .45) 0, rgba(143, 155, 179, .18) 55%, transparent 72%); }
    /* 오른쪽 아래: 원자 색이 바뀌는 까닭 (오개념 막기) */
    .key.why { left: auto; right: 24px; gap: 8px; padding: 14px 18px; }
    .why h3 { margin: 0 0 2px; color: var(--ink); font-size: .86rem; font-weight: 800; }
    .why div { gap: 10px; }
    .why i { flex: none; width: 10px; height: 10px; border-radius: 50%; background: var(--c); box-shadow: 0 0 8px var(--c); }
    .why p { margin: 4px 0 0; padding-top: 8px; border-top: 1px solid var(--line); color: var(--dim); font-size: .76rem; line-height: 1.5; }
    @media (max-width: 1500px) { .key { bottom: 118px; } }
    @media (max-width: 640px) { .key { display: none; } }
    .error { position: absolute; inset: 0; display: grid; place-content: center; padding: 2rem; text-align: center; color: #fecaca; }

    @media (max-width: 1150px) { .steps { left: 28px; top: 92px; transform: none; } }
    @media (max-width: 900px) {
      .app { height: auto; grid-template-columns: 1fr; grid-template-rows: minmax(520px, 70vh) auto; }
      .panel { padding-top: 24px; border-left: 0; border-top: 1px solid var(--line); }
      #ladder { height: 260px; flex: none; }
    }
    @media (max-width: 640px) {
      .dock { left: 12px; right: 12px; transform: none; flex-wrap: wrap; justify-content: center; gap: 14px; border-radius: 22px; padding: 14px; }
      .steps { font-size: .78rem; } .steps li + li::before { width: 14px; margin: 0 .4rem; }
    }
  </style>
</head>
<body>
  <div class="app">
    <section class="stage" aria-label="삼차원 분자 관찰 화면">
      <canvas id="scene"></canvas>
      <div class="title"><small>OLED 가상실험실</small><h1>형광빛의 원리</h1></div>
      <ol class="steps" id="steps" aria-live="polite">
        <li style="--c:var(--light)"><i></i>빛 쬐기</li>
        <li style="--c:var(--uv)"><i></i><span>흡수</span></li>
        <li style="--c:var(--heat)"><i></i>열로 조금 잃음</li>
        <li style="--c:var(--glow)"><i></i>형광</li>
      </ol>
      <div class="key" aria-label="모형 읽는 법">
        <div><span class="ball"></span><span><b>공</b>원자가 있는 자리</span></div>
        <div><span class="cloud"></span><span><b>구름</b>고리 전체가 함께 쓰는 전자</span></div>
      </div>
      <div class="key why" aria-label="원자 색이 바뀌는 까닭">
        <h3>원자 색이 바뀌는 까닭</h3>
        <div><i style="--c:#e2bd72"></i>금색 · 빛을 흡수한 들뜬 상태</div>
        <div><i style="--c:#ff6a4d"></i>빨강 · 분자의 떨림(진동)으로 새는 열</div>
        <div><i style="--c:#5aa9ff"></i>파랑 · 형광으로 내보내는 빛</div>
        <p>눈에 안 보이는 에너지를 색으로 나타냈어요.<br>실제 원자의 색이 변하는 것은 아니에요.</p>
      </div>
      <div class="dock">
        <div class="pick">
          <div class="pick-label">쬐어줄 빛 <b id="light-name">자외선 365 nm</b></div>
          <div class="chips" id="chips" role="radiogroup" aria-label="빛의 색깔"></div>
        </div>
        <button class="fire ready" id="fire" type="button">빛 쬐기</button>
        <div class="side">
          <div class="seg" id="speed" aria-label="재생 속도">
            <button type="button" data-rate=".25" aria-pressed="false">느리게</button>
            <button type="button" data-rate="1" aria-pressed="true">보통</button>
            <button type="button" data-rate="2" aria-pressed="false">빠르게</button>
          </div>
          <button class="pause" id="pause" type="button" disabled></button>
        </div>
      </div>
    </section>
    <aside class="panel">
      <div>
        <h2>전자의 에너지 계단</h2>
        <p class="note" id="note">빛을 쬐면 전자가 어떻게 움직이는지 지켜보세요</p>
      </div>
      <canvas id="ladder" aria-hidden="true"></canvas>
      <div>
        <div class="grid" id="grid" aria-label="에너지 100칸 결과"></div>
        <div class="totals">
          <div class="r"><small>열로 빠진 에너지</small><strong id="heat-count">—</strong></div>
          <div class="b"><small>형광으로 나온 에너지</small><strong id="light-count">—</strong></div>
        </div>
      </div>
    </aside>
  </div>

  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}</script>
  <script type="module">
    const $ = id => document.getElementById(id);
    const canvas = $('scene'), ladder = $('ladder'), lctx = ladder.getContext('2d');
    const LIGHTS = [[365, '자외선'], [405, '보라빛'], [450, '파란빛'], [520, '초록빛'], [580, '노란빛'], [605, '주황빛'], [650, '빨간빛']];
    const IMPACT = 1, ABSORB_MIN = 355, ABSORB_MAX = 375;
    const absorbs = nm => nm >= ABSORB_MIN && nm <= ABSORB_MAX;
    const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
    const smooth = (a, b, t) => { const x = clamp((t - a) / (b - a), 0, 1); return x * x * (3 - 2 * x); };
    const lerp = (a, b, k) => a + (b - a) * k;
    // 에너지 수지 점검: 흡수한 빛은 열 25 + 형광 75로 나뉜다.
    console.assert(25 + 75 === 100, '에너지 수지 오류');

    function wavelengthColor(nm) {
      if (nm < 380) return '#a78bfa';
      let r = 0, g = 0, b = 0;
      if (nm < 440) { r = (440 - nm) / 60; b = 1; }
      else if (nm < 490) { g = (nm - 440) / 50; b = 1; }
      else if (nm < 510) { g = 1; b = (510 - nm) / 20; }
      else if (nm < 580) { r = (nm - 510) / 70; g = 1; }
      else if (nm < 645) { r = 1; g = (645 - nm) / 65; }
      else r = 1;
      const hex = v => Math.round(Math.max(.12, v) * 255).toString(16).padStart(2, '0');
      return `#${hex(r)}${hex(g)}${hex(b)}`;
    }

    // ---------- 상태 ----------
    let phase = 'idle', t = 0, paused = false, rate = 1, pick = 0, shotNm = 365;
    const endTime = () => absorbs(shotNm) ? 5.1 : 1.9;

    // ---------- 조작 막대 ----------
    const chips = LIGHTS.map(([nm, name], i) => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'chip' + (i ? '' : ' uv'); b.role = 'radio';
      b.style.setProperty('--c', wavelengthColor(nm)); b.title = `${name} ${nm} nm`; b.setAttribute('aria-label', b.title);
      b.addEventListener('click', () => selectLight(i));
      return $('chips').appendChild(b);
    });
    function selectLight(i) {
      pick = i;
      const [nm, name] = LIGHTS[i];
      chips.forEach((c, k) => c.setAttribute('aria-checked', String(k === i)));
      $('light-name').textContent = `${name} ${nm} nm`;
      document.documentElement.style.setProperty('--light', wavelengthColor(nm));
      if (lightCol) setLightColor(wavelengthColor(nm));
      if (phase === 'done') reset();
    }
    const PAUSE_ICON = '<svg viewBox="0 0 12 12"><rect x="1" y="1" width="3.5" height="10"/><rect x="7.5" y="1" width="3.5" height="10"/></svg>일시정지';
    const PLAY_ICON = '<svg viewBox="0 0 12 12"><path d="M2 1l9 5-9 5z"/></svg>계속 재생';
    $('pause').innerHTML = PAUSE_ICON;
    $('pause').addEventListener('click', () => { paused = !paused; $('pause').innerHTML = paused ? PLAY_ICON : PAUSE_ICON; });
    $('speed').addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      rate = Number(b.dataset.rate);
      for (const x of $('speed').children) x.setAttribute('aria-pressed', String(x === b));
    });
    $('fire').addEventListener('click', () => {
      shotNm = LIGHTS[pick][0]; t = 0; phase = 'running'; paused = false;
      $('pause').innerHTML = PAUSE_ICON; $('pause').disabled = false;
      $('fire').disabled = true; $('fire').classList.remove('ready'); $('fire').textContent = '진행 중';
      chips.forEach(c => c.disabled = true);
      stepKey = '';
    });
    function finish() {
      phase = 'done'; t = endTime();
      $('fire').disabled = false; $('fire').textContent = '다시'; $('pause').disabled = true;
      chips.forEach(c => c.disabled = false);
    }
    function reset() {
      phase = 'idle'; t = 0; stepKey = '';
      $('fire').disabled = false; $('fire').classList.add('ready'); $('fire').textContent = '빛 쬐기'; $('fire').style.setProperty('--p', 0);
    }

    // ---------- 진행 단계 · 설명 · 100칸 ----------
    const stepEls = [...$('steps').children];
    const NOTES = {
      idle: '빛을 쬐면 전자가 어떻게 움직이는지 지켜보세요',
      firing: '빛이 분자를 향해 날아가는 중이에요',
      excited: '전자가 빛에너지를 받아 위층으로 뛰어올랐어요',
      heat: '분자가 떨면서 에너지를 조금 열로 잃어요',
      fluor: '남은 에너지를 빛으로 내보내며 바닥으로 내려와요',
      done: '받은 에너지 100 중 25는 열, 75는 형광빛이 되었어요',
      passed: '이 분자는 자외선만 흡수해요. 이 빛은 그냥 지나가요'
    };
    let stepKey = '';
    function setStep(key) {
      if (key === stepKey) return;
      stepKey = key;
      const at = { idle: -1, firing: 0, excited: 1, heat: 2, fluor: 3, done: 4, passed: 2 }[key];
      stepEls.forEach((li, i) => { li.className = i < at ? 'done' : i === at ? 'now' : ''; });
      stepEls[1].querySelector('span').textContent = key === 'passed' ? '흡수 안 됨' : '흡수';
      if (key === 'passed') { stepEls[1].className = 'miss'; stepEls[2].className = stepEls[3].className = ''; }
      $('note').textContent = NOTES[key];
      $('note').style.color = { excited: 'var(--uv)', heat: '#ff9c89', fluor: '#8cc4ff', passed: '#ff9c89' }[key] || '';
    }
    const cells = Array.from({ length: 100 }, () => $('grid').appendChild(document.createElement('i')));
    let shown = '';
    function showEnergy(heat, light) {
      if (shown === `${heat},${light}`) return;
      shown = `${heat},${light}`;
      cells.forEach((c, i) => c.className = i < heat ? 'red' : i >= 25 && i < 25 + light ? 'blue' : '');
      $('heat-count').textContent = heat < 0 ? '—' : `${heat}%`;
      $('light-count').textContent = light < 0 ? '—' : `${light}%`;
    }

    // ---------- 에너지 계단 그림 ----------
    // 보라 화살표(흡수) 길이 = 100, 붉은 계단(열) = 25, 파란 화살표(형광) = 75 로 비율을 맞춘다.
    function arrowHead(x, y, dir, color) {
      lctx.fillStyle = color; lctx.beginPath();
      lctx.moveTo(x, y); lctx.lineTo(x - 6, y - 10 * dir); lctx.lineTo(x + 6, y - 10 * dir); lctx.closePath(); lctx.fill();
    }
    function drawLadder(T, hit, on) {
      const dpr = Math.min(devicePixelRatio, 2), w = ladder.clientWidth, h = ladder.clientHeight;
      if (ladder.width !== Math.round(w * dpr) || ladder.height !== Math.round(h * dpr)) { ladder.width = w * dpr; ladder.height = h * dpr; }
      lctx.setTransform(dpr, 0, 0, dpr, 0, 0); lctx.clearRect(0, 0, w, h);
      const left = 74, right = w - 6, xc = (left + right) / 2;
      const y0 = h - 22, L = h - 54, top = y0 - L, base = y0 - .75 * L, g = .25 * L / 3;

        renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = .9;
        scene = new THREE.Scene(); scene.background = backgroundTexture();
        scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(renderer), .04).texture;
        camera = new THREE.PerspectiveCamera(40, 1, .05, 100); camera.position.set(2.2, 2.6, 9.4);
        controls = new OrbitControls(camera, canvas); controls.enableDamping = true; controls.dampingFactor = .07; controls.enableZoom = true; controls.minDistance = 6.5; controls.maxDistance = 15; controls.enablePan = false; controls.target.set(-.7, 0, 0);
        scene.add(new THREE.AmbientLight('#dfe4ec', .35));
        const key = new THREE.DirectionalLight('#ffffff', 1.1); key.position.set(3, 5, 6); scene.add(key);
        glowTex = glowTexture();
        createMolecule(); createCloud(); createLamp(); createEffects();
        composer = new EffectComposer(renderer);
        composer.addPass(new RenderPass(scene, camera));
        composer.addPass(new UnrealBloomPass(new THREE.Vector2(512, 512), 1, .5, 1.8));
        composer.addPass(new OutputPass());
        resize(); new ResizeObserver(resize).observe(canvas.parentElement);
        selectLight(0); reset();
        requestAnimationFrame(ms => { last = ms / 1000; tick(ms); });
      } catch (error) {
        console.error('3D 실험실 초기화 실패:', error);
        const m = document.createElement('div'); m.className = 'error'; m.textContent = `3D 화면을 열 수 없습니다. 인터넷 연결과 WebGL 사용 가능 여부를 확인하세요. (${error.message})`; canvas.after(m);
      }
    }
    main();
  </script>
