<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>[발표 슬라이드] 분자의 빛과 디스플레이의 과학 - KAIST 첨단과학 탐구</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <style>
    .slide-viewer {
      background: #0f172a;
      border-radius: var(--radius);
      padding: 2.2rem 2.8rem;
      min-height: 600px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      color: #ffffff;
      box-shadow: var(--shadow-lg);
      position: relative;
      border: 1px solid #334155;
    }
    .slide-viewer:fullscreen,
    .slide-viewer:-webkit-full-screen {
      padding: clamp(2rem, 3.5vh, 3.5rem) clamp(2.5rem, 4vw, 4.5rem) !important;
      border-radius: 0 !important;
      background: #0b1120 !important;
      height: 100vh !important;
      width: 100vw !important;
      box-sizing: border-box !important;
    }
    .slide-item { display: none; }
    .slide-item.active {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 100%;
      flex: 1;
      animation: fadeIn 0.25s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.995); }
      to { opacity: 1; transform: scale(1); }
    }
    .slide-tag {
      display: inline-block;
      padding: 0.35rem 0.9rem;
      border-radius: 9999px;
      font-size: 0.88rem;
      font-weight: 700;
      background: rgba(59, 130, 246, 0.25);
      color: #93c5fd;
      border: 1px solid rgba(59, 130, 246, 0.4);
      margin-bottom: 0.85rem;
      width: fit-content;
    }
    .slide-title {
      font-size: clamp(1.8rem, 2.3vw, 2.3rem);
      font-weight: 800;
      line-height: 1.35;
      margin-bottom: 1.25rem;
      color: #f8fafc;
      letter-spacing: -0.015em;
    }
    .slide-body {
      font-size: 1.15rem;
      line-height: 1.8;
      color: #cbd5e1;
      flex: 1;
    }
    .slide-footer-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid #334155;
      padding-top: 1.25rem;
      margin-top: 1.5rem;
    }
    .slide-btn {
      background: #1e293b;
      color: #ffffff;
      border: 1px solid #475569;
      padding: 0.55rem 1.25rem;
      border-radius: 0.5rem;
      cursor: pointer;
      font-weight: 700;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }
    .slide-btn:hover:not(:disabled) { background: #334155; border-color: #94a3b8; }
    .slide-btn.primary { background: #3b82f6; border-color: #60a5fa; }
    .slide-btn.primary:hover:not(:disabled) { background: #2563eb; }
    .slide-counter { font-size: 1.05rem; font-weight: 800; color: #94a3b8; }
  </style>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <div class="app-layout">
    <!-- Shared Sidebar -->
    <aside class="sidebar" id="app-sidebar"></aside>

    <!-- Main Content -->
    <main class="main-content">
      <header class="topbar">
        <div class="topbar-left">
          <button class="sidebar-toggle-btn" onclick="toggleSidebar()"><i data-lucide="menu"></i></button>
          <span class="current-view-title"><i data-lucide="presentation"></i> [발표 슬라이드] 분자의 빛과 디스플레이의 과학</span>
        </div>
        <div class="topbar-actions">
          <button class="topbar-btn" onclick="toggleFullScreen()"><i data-lucide="maximize-2"></i> <span>전체화면 발표</span></button>
          <a href="lesson-plan.html" class="topbar-btn"><i data-lucide="clipboard-list"></i> <span>지도안 보기</span></a>
          <a href="lab.html" class="topbar-btn primary"><i data-lucide="flask-conical"></i> <span>가상실험실 바로가기</span></a>
        </div>
      </header>

      <div class="content-container">
        
        <!-- 차시 선택 탭 바 -->
        <div class="slide-lesson-tabs">
          <button class="slide-lesson-btn active" onclick="switchSlideLesson(1)">
            <i data-lucide="sparkles"></i> <span>[1차시] 자외선과 형광</span>
          </button>
          <button class="slide-lesson-btn" onclick="switchSlideLesson(2)">
            <i data-lucide="layers"></i> <span>[2차시] 전자의 점프</span>
          </button>
          <button class="slide-lesson-btn" onclick="switchSlideLesson(3)">
            <i data-lucide="rotate-cw"></i> <span>[3차시] 스핀과 OLED</span>
          </button>
          <button class="slide-lesson-btn" onclick="switchSlideLesson(4)">
            <i data-lucide="rocket"></i> <span>[4차시] KAIST 구출작전</span>
          </button>
        </div>

        <!-- 슬라이드 뷰어 컨테이너 -->
        <div class="slide-viewer" id="slideViewer">
          <div id="slideContentArea" style="flex:1; display:flex; flex-direction:column;">
            <!-- 동적으로 렌더링됩니다 -->
          </div>

          <div class="slide-footer-nav">
            <span id="standalone-slide-counter" class="slide-counter">1 / 9</span>
            <div style="display:flex; gap:0.5rem;">
              <button class="slide-btn" id="btn-slide-prev" onclick="moveSlide(-1)">
                <i data-lucide="arrow-left"></i> <span>이전</span>
              </button>
              <button class="slide-btn primary" id="btn-slide-next" onclick="moveSlide(1)">
                <span>다음</span> <i data-lucide="arrow-right"></i>
              </button>
            </div>
          </div>
        </div>

      </div>
    </main>
  </div>

  <script src="../assets/js/sidebar.js"></script>
  <script src="../assets/js/presentation-modal.js"></script>
  <script>
    renderSidebar('oled', 'slides');

    let currentLesson = 1;
    let currentSlide = 0;

    function renderSlideDeck() {
      const deck = presentationModalData.oled[currentLesson];
      if (!deck) return;

      const slide = deck.slides[currentSlide];
      const total = deck.slides.length;
      const area = document.getElementById('slideContentArea');

      area.innerHTML = `
        <div class="slide-item active">
          <div>
            <div class="slide-tag">${slide.tag}</div>
            <h2 class="slide-title">${slide.title}</h2>
            <div class="slide-body">
              ${slide.content}
            </div>
          </div>
        </div>
      `;

      // Counter
      document.getElementById('standalone-slide-counter').innerText = `${currentSlide + 1} / ${total}`;

      // Buttons
      const btnPrev = document.getElementById('btn-slide-prev');
      const btnNext = document.getElementById('btn-slide-next');
      if (btnPrev) {
        btnPrev.disabled = (currentSlide === 0);
        btnPrev.style.opacity = (currentSlide === 0) ? '0.4' : '1';
      }
      if (btnNext) {
        btnNext.disabled = (currentSlide === total - 1);
        btnNext.style.opacity = (currentSlide === total - 1) ? '0.4' : '1';
      }

      if (window.lucide) {
        try { lucide.createIcons(); } catch(e) {}
      }
    }

    function switchSlideLesson(lessonNum) {
      currentLesson = lessonNum;
      currentSlide = 0;

      // Update tab active state
      const tabs = document.querySelectorAll('.slide-lesson-btn');
      tabs.forEach((tab, idx) => {
        if (idx + 1 === lessonNum) {
          tab.classList.add('active');
        } else {
          tab.classList.remove('active');
        }
      });

      renderSlideDeck();
    }

    function moveSlide(dir) {
      const deck = presentationModalData.oled[currentLesson];
      if (!deck) return;
      const total = deck.slides.length;

      const target = currentSlide + dir;
      if (target >= 0 && target < total) {
        currentSlide = target;
        renderSlideDeck();
      }
    }

    // Keyboard navigation
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') {
        e.preventDefault();
        moveSlide(1);
      } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
        e.preventDefault();
        moveSlide(-1);
      }
    });

    // Fullscreen toggle
    function toggleFullScreen() {
      const elem = document.getElementById('slideViewer');
      if (!document.fullscreenElement) {
        elem.requestFullscreen().catch(err => alert('전체화면 오류: ' + err.message));
      } else {
        document.exitFullscreen();
      }
    }

    // Initialize with Lesson 1
    renderSlideDeck();
  </script>
</body>
</html>
